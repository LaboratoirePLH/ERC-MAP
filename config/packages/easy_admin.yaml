easy_admin:
    site_name: "ERC-MAP - Administration"
    formats:
        date: "d/m/Y"
        time: "H:i"
        datetime: "d/m/Y H:i:s"
        number: "%.8f"
    list:
        max_results: 30
    show:
        max_results: 20
    design:
        menu:
            - label: "Gestion"
            - { entity: "Chercheur", default: true }
            - NewAccounts
            - Projet
            - Suivi
            - VerrouEntite
            - RequeteEnregistree
            - { label: "Source" }
            - SourceTraductions
            - Auteur
            - CategorieMateriau
            - CategorieSource
            - CategorieSupport
            - Langue
            - Materiau
            - Titre
            - TypeSource
            - TypeSupport
            - { label: "Attestation" }
            - AttestationEtatFiche
            - AttestationTraductions
            - Agent
            - CategorieMateriel
            - CategorieOccasion
            - EtatFiche
            - Formule
            - Materiel
            - Occasion
            - Pratique
            - { label: "Agent" }
            - ActiviteAgent
            - Agentivite
            - Genre
            - Nature
            - StatutAffiche
            - { label: "Elément" }
            - ElementTraductions
            - CategorieElement
            - GenreElement
            - NatureElement
            - NombreElement
            - TraductionElement
            - { label: "Localisation" }
            - Localisation
            - EntitePolitique
            - GrandeRegion
            - QFonction
            - QTopographie
            - SousRegion

    entities:
        Agent:
            class: App\Entity\Agent
            label: Agent
            list:
                sort: ["attestation", "DESC"]
                filters:
                    - property: "id_attestation"
                      label: "ID Attestation"
                      type: 'App\EasyAdmin\Filter\IdAttestation'
                      mapped: false
        ActiviteAgent:
            class: App\Entity\ActiviteAgent
            label: Activité (Agent)
        Agentivite:
            class: App\Entity\Agentivite
            label: Agentivité
        Auteur:
            class: App\Entity\Auteur
            label: Auteur
        CategorieElement:
            class: App\Entity\CategorieElement
            label: Catégorie (Elément)
        CategorieMateriau:
            class: App\Entity\CategorieMateriau
            label: Catégorie (Materiau)
        CategorieMateriel:
            class: App\Entity\CategorieMateriel
            label: Catégorie (Materiel)
        CategorieOccasion:
            class: App\Entity\CategorieOccasion
            label: Catégorie (Occasion)
        CategorieSource:
            class: App\Entity\CategorieSource
            label: Catégorie (Source)
        CategorieSupport:
            class: App\Entity\CategorieSupport
            label: Catégorie (Support)
        Chercheur:
            class: App\Entity\Chercheur
            label: Chercheur
            list:
                dql_filter: "entity.actif = true"
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "prenomNom", type: "string" }
                    - { property: "username", type: "string" }
                    - { property: "mail", type: "email" }
                    - { property: "institution", type: "string" }
                    - { property: "role", type: "text" }
                    - { property: "nomsProjets", type: "string" }
            edit:
                fields:
                    - {
                          property: "prenomNom",
                          type: "string",
                          type_options: { required: true },
                      }
                    - { property: "username", type: "string", type_options: { required: true } }
                    - {
                          property: "mail",
                          type: "email",
                          type_options: { required: true },
                      }
                    - {
                          property: "newPassword",
                          label: "Nouveau mot de passe",
                          type: "string",
                      }
                    - { property: "institution", type: "string" }
                    - {
                          property: "role",
                          type: "choice",
                          type_options:
                              {
                                  choices:
                                      {
                                          Administrateur: "admin",
                                          Modérateur: "moderator",
                                          Contributeur: "contributor",
                                          Utilisateur: "user",
                                      },
                              },
                      }
                    - {
                          property: "projets",
                          type: "entity",
                          class: App\Entity\Projet,
                          type_options:
                              { required: false, by_reference: false, multiple: true },
                      }
                    - { property: "actif", type: "checkbox" }
                    - { property: "gestionnaireComptes", type: "checkbox" }

            new:
                fields:
                    - {
                          property: "prenomNom",
                          type: "string",
                          type_options: { required: true },
                      }
                    - { property: "username", type: "string", type_options: { required: true } }
                    - {
                          property: "mail",
                          type: "email",
                          type_options: { required: true },
                      }
                    - {
                          property: "newPassword",
                          label: "Nouveau mot de passe",
                          type: "string",
                          type_options: { required: true },
                      }
                    - { property: "institution", type: "string" }
                    - {
                          property: "role",
                          type: "choice",
                          type_options:
                              {
                                  choices:
                                      {
                                          Administrateur: "admin",
                                          Modérateur: "moderator",
                                          Contributeur: "contributor",
                                          Utilisateur: "user",
                                      },
                              },
                      }
                    - {
                          property: "projets",
                          type: "entity",
                          class: App\Entity\Projet,
                          type_options:
                              { required: false, by_reference: false, multiple: true },
                      }
                    - { property: "actif", type: "checkbox" }
        EntitePolitique:
            class: App\Entity\EntitePolitique
            label: Entité Politique
        EtatFiche:
            class: App\Entity\EtatFiche
            label: Etat Fiche
            list:
                fields:
                    [
                        { property: "id", type: "integer" },
                        { property: "nomFr", type: "string" },
                        { property: "nomEn", type: "string" },
                        {
                            property: "open_access",
                            label: "Inclure en Open Access ?",
                            type: "toggle",
                        },
                    ]
        Formule:
            class: App\Entity\Formule
            label: Formule
            list:
                sort: ["attestation", "DESC"]
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "formule", type: "string" }
                    - { property: "attestation", type: "string" }
                    - { property: "positionFormule", type: "integer" }
                    - { property: "puissancesDivines", type: "integer" }
                filters:
                    - property: "id_attestation"
                      label: "ID Attestation"
                      type: 'App\EasyAdmin\Filter\IdAttestation'
                      mapped: false
        Genre:
            class: App\Entity\Genre
            label: Genre
        GenreElement:
            class: App\Entity\GenreElement
            label: Genre (Elément)
        GrandeRegion:
            class: App\Entity\GrandeRegion
            label: Grande Région
            list:
                sort: ["nomFr", "ASC"]
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "nomFr", type: "string" }
                    - { property: "nomEn", type: "string" }
                    - { property: "progression", type: "integer", format: "%d" }
        Langue:
            class: App\Entity\Langue
            label: Langue
        Localisation:
            class: App\Entity\Localisation
            label: Localisation
            list:
                sort: ["id", "DESC"]
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "grandeRegion.nomFr", type: "string" }
                    - { property: "sousRegion.nomFr", type: "string" }
                    - { property: "pleiadesVille", type: "integer", format: "%d" }
                    - { property: "nomVille", type: "string" }
                    - { property: "pleiadesSite", type: "integer", format: "%d" }
                    - { property: "nomSite", type: "string" }
                filters:
                    - property: "grandeSousRegion"
                      label: ""
                      type: 'App\EasyAdmin\Filter\GrandeSousRegion'
                      mapped: false
                actions: ["-new", "-delete"]
            edit:
                fields:
                    - { property: "reel", type: "checkbox" }
                    - {
                          property: "entitePolitique",
                          type: "entity",
                          class: App\Entity\EntitePolitique,
                          type_options: { required: false },
                      }
                    - {
                          property: "grandeRegion",
                          type: "entity",
                          class: App\Entity\GrandeRegion,
                          type_options: { required: false },
                      }
                    - {
                          property: "sousRegion",
                          type: "entity",
                          class: App\Entity\SousRegion,
                          type_options: { required: false },
                      }
                    - { property: "pleiadesVille", type: "integer", format: "%d" }
                    - { property: "nomVille", type: "string" }
                    - { property: "pleiadesSite", type: "integer", format: "%d" }
                    - { property: "nomSite", type: "string" }
                    - { property: "latitude", type: "number", type_options: { scale: 8 } }
                    - { property: "longitude", type: "number", type_options: { scale: 8 } }
                    - {
                          property: "topographies",
                          type: "entity",
                          class: App\Entity\QTopographie,
                          type_options:
                              { required: false, by_reference: false, multiple: true },
                      }
                    - {
                          property: "fonctions",
                          type: "entity",
                          class: App\Entity\QFonction,
                          type_options:
                              { required: false, by_reference: false, multiple: true },
                      }
                    - { property: "commentaireFr", type: "text" }
                    - { property: "commentaireEn", type: "text" }
        Materiau:
            class: App\Entity\Materiau
            label: Matériau
        Materiel:
            class: App\Entity\Materiel
            label: Matériel
        Nature:
            class: App\Entity\Nature
            label: Nature
        NatureElement:
            class: App\Entity\NatureElement
            label: Nature (Element)
        NombreElement:
            class: App\Entity\NombreElement
            label: Nombre (Element)
        Occasion:
            class: App\Entity\Occasion
            label: Occasion
        Pratique:
            class: App\Entity\Pratique
            label: Pratique
        Projet:
            class: App\Entity\Projet
            label: Projet
        RequeteEnregistree:
            class: App\Entity\RequeteEnregistree
            label: Requête Enregistrée
        QFonction:
            class: App\Entity\QFonction
            label: Qualité Fonctionnnelle
        QTopographie:
            class: App\Entity\QTopographie
            label: Qualité Topographique
        SousRegion:
            class: App\Entity\SousRegion
            label: Sous Région
            list:
                sort: ["nomFr", "ASC"]
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "grandeRegion", type: "entity", class: App\Entity\GrandeRegion }
                    - { property: "nomFr", type: "string" }
                    - { property: "nomEn", type: "string" }
                    - { property: "progression", type: "integer", format: "%d" }
        StatutAffiche:
            class: App\Entity\StatutAffiche
            label: Statut Affiché
        Suivi:
            class: App\Entity\Suivi
            label: Suivi
            list:
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "nom_table", type: "string" }
                    - { property: "id_entite", type: "integer" }
                    - { property: "action", type: "string" }
                    - { property: "date_heure", type: "datetime" }
        Titre:
            class: App\Entity\Titre
            label: Titre
        TraductionElement:
            class: App\Entity\TraductionElement
            label: Traduction (Elément)
        TypeSource:
            class: App\Entity\TypeSource
            label: Type (Source)
        TypeSupport:
            class: App\Entity\TypeSupport
            label: Type (Support)
        VerrouEntite:
            class: App\Entity\VerrouEntite
            label: Verrou Entité
        NewAccounts:
            class: App\Entity\Chercheur
            label: Nouveaux utilisateurs
            list:
                dql_filter: "entity.actif = false"
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "prenomNom", type: "string" }
                    - { property: "username", type: "string" }
                    - { property: "mail", type: "email" }
                    - { property: "institution", type: "string" }
                    - { property: "dateAjout", type: "datetime" }
                actions:
                    [
                        "-search",
                        "-new",
                        { name: "validateUser", label: "Activer le compte" },
                    ]
            edit:
                fields:
                    - {
                          property: "prenomNom",
                          type: "string",
                          type_options: { required: true },
                      }
                    - {
                          property: "username",
                          type: "string",
                          type_options: { required: true },
                      }
                    - {
                          property: "mail",
                          type: "email",
                          type_options: { required: true },
                      }
                    - { property: "institution", type: "string" }
                    - {
                          property: "role",
                          type: "choice",
                          type_options:
                              {
                                  choices:
                                      {
                                          Administrateur: "admin",
                                          Modérateur: "moderator",
                                          Contributeur: "contributor",
                                          Utilisateur: "user",
                                      },
                              },
                      }
                    - {
                          property: "projets",
                          type: "entity",
                          class: App\Entity\Projet,
                          type_options:
                              { required: false, by_reference: false, multiple: true },
                      }
                    - { property: "actif", type: "checkbox" }
                    - { property: "gestionnaireComptes", type: "checkbox" }
        AttestationEtatFiche:
            class: App\Entity\Attestation
            label: Attestations (Etat Fiche)
            list:
                fields:
                    - { property: "source.id", label: "ID Source", type: "string" }
                    - { property: "id", type: "integer" }
                    - { property: "affichage", type: "string" }
                    - { property: "etatFiche.nomFr", label: "Etat Fiche", type: "string" }
                filters:
                    - property: "id_source"
                      label: "ID Source"
                      type: 'App\EasyAdmin\Filter\IdSource'
                      mapped: false
                actions: ["-new", "-delete"]
            edit:
                fields:
                    - {
                          property: "etatFiche",
                          type: "entity",
                          class: App\Entity\EtatFiche,
                          type_options: { required: true },
                      }
        AttestationTraductions:
            class: App\Entity\Attestation
            label: Attestations (Traductions)
            list:
                fields:
                    - { property: "source.id", label: "ID Source", type: "integer" }
                    - { property: "id", type: "integer" }
                    - { property: "affichage", type: "string" }
                    - { property: "traduireFr", type: "toggle" }
                    - { property: "traduireEn", type: "toggle" }
                filters:
                    - property: "id_source"
                      label: "ID Source"
                      type: 'App\EasyAdmin\Filter\IdSource'
                      mapped: false
                actions: ["-new", "-edit", "-delete"]
        SourceTraductions:
            class: App\Entity\Source
            label: Sources (Traductions)
            list:
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "traduireFr", type: "toggle" }
                    - { property: "traduireEn", type: "toggle" }
                actions: ["-new", "-edit", "-delete"]
        ElementTraductions:
            class: App\Entity\Element
            label: Elements (Traductions)
            list:
                fields:
                    - { property: "id", type: "integer" }
                    - { property: "traduireFr", type: "toggle" }
                    - { property: "traduireEn", type: "toggle" }
                actions: ["-new", "-edit", "-delete"]
