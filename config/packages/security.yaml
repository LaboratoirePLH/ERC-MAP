security:
    password_hashers:
        App\Entity\Chercheur:
            algorithm: bcrypt

    enable_authenticator_manager: true

    providers:
        user:
            entity:
                class: App\Entity\Chercheur
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: user
            form_login:
                default_target_path: home
            logout:
                path: /logout
                target: /login
            custom_authenticator:
                - App\Security\LoginFormAuthenticator
            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800 # 1 week in seconds
                path: /
            entry_point: form_login

            # activate different ways to authenticate

            # http_basic: true
            # https://symfony.com/doc/current/security.html#a-configuring-how-your-users-will-authenticate

            # form_login: true
            # https://symfony.com/doc/current/security/form_login_setup.html

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/maintenance, roles: ROLE_ADMIN }
        - { path: ^/forgotten_password, roles: PUBLIC_ACCESS }
        - { path: ^/reset_password, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/language, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/inactive_account, roles: [ROLE_UNVERIFIED_USER, ROLE_USER] }
        # - { path: ^/, roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }
